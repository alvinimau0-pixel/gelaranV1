name: Daily production uptime report

on:
  schedule:
    # 00:05 UTC every day (08:05 Malaysia time).
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to report on"
        required: false
        default: "https://gelaran-v1-gm-2030.vercel.app"
        type: string

concurrency:
  group: daily-production-uptime-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Generate daily production uptime report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYNTHETIC_BASE_URL: ${{ inputs.base_url || 'https://gelaran-v1-gm-2030.vercel.app' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run daily uptime and performance checks
        shell: bash
        run: |
          set -o pipefail
          node scripts/uptime-smoke.mjs | tee uptime-report.json

      - name: Render Markdown report
        if: always()
        run: node scripts/render-uptime-report.mjs uptime-report.json | tee daily-uptime-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload daily reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-uptime-report-${{ github.run_id }}
          path: |
            uptime-report.json
            daily-uptime-report.md
          if-no-files-found: warn
          retention-days: 90
