name: Production E2E smoke tests

on:
  deployment_status:

concurrency:
  group: production-e2e-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke-test production deployment
    if: >-
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
       github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      E2E_BASE_URLS: >-
        https://gelaran-v1-gm-2030.vercel.app,${{
          github.event.deployment_status.environment_url ||
          github.event.deployment_status.target_url ||
          'https://gelaran-v1-gm-2030.vercel.app'
        }}
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production E2E smoke tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee production-e2e-report.json

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-report-${{ github.run_id }}
          path: production-e2e-report.json
          if-no-files-found: warn
          retention-days: 14
